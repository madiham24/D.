<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0704;
      font-family: 'Lato', 'Poppins', system-ui, -apple-system, sans-serif;
      position: fixed;
      top: 0;
      left: 0;
    }

    @import url(https://fonts.googleapis.com/css?family=Lato:300italic);

    /* BACKGROUND */
    .magic-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #2f1c10, #050201);
      z-index: -2;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      position: relative;
      padding: 20px 0;
    }

    /* ===== YOUR EXACT CAKE ANIMATION (100% INTACT) ===== */
    #cake {
      display: block;
      position: relative;
      margin: -10em auto 0 auto;
      max-width: 90vw;
      width: auto;
      height: auto;
    }

    .cake {
      background: #ffffff;
      border-radius: 10px;
      position: absolute;
      top: 228px;
      left: 50%;
      margin-left: -2.4px;
      margin-top: -8.33333333px;
      width: 5px;
      height: 35px;
      transform: translateY(-300px);
      backface-visibility: hidden;
      animation: in 500ms 6s ease-out forwards;
    }
    .cake:after, .cake:before {
      background: rgba(255, 0, 0, 0.4);
      content: "";
      position: absolute;
      width: 100%;
      height: 2.22222222px;
    }
    .cake:after { top: 25%; left: 0; }
    .cake:before { top: 45%; left: 0; }

    .fuego {
      border-radius: 100%;
      position: absolute;
      top: -20px;
      left: 50%;
      margin-left: -2.6px;
      width: 6.66666667px;
      height: 18px;
    }
    .fuego:nth-child(1) { animation: fuego 2s 6.5s infinite; }
    .fuego:nth-child(2) { animation: fuego 1.5s 6.5s infinite; }
    .fuego:nth-child(3) { animation: fuego 1s 6.5s infinite; }
    .fuego:nth-child(4) { animation: fuego 0.5s 6.5s infinite; }
    .fuego:nth-child(5) { animation: fuego 0.2s 6.5s infinite; }

    @keyframes fuego {
      0%, 100% {
        background: rgba(254, 248, 97, 0.95);
        box-shadow: 0 0 40px 12px rgba(248, 233, 209, 0.6);
        transform: translateY(0) scale(1);
      }
      50% {
        background: rgba(255, 80, 0, 0.4);
        box-shadow: 0 0 40px 20px rgba(248, 233, 209, 0.4);
        transform: translateY(-20px) scale(0);
      }
    }

    @keyframes in {
      to { transform: translateY(0); }
    }

    /* CANDLE CLICK AREA (perfect alignment after animation) */
    .candle-hit-area {
      position: absolute;
      top: 195px;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 60px;
      cursor: pointer;
      z-index: 100;
      background: transparent;
      pointer-events: none;
    }
    .candle-hit-area.active {
      pointer-events: auto;
    }

    /* COUNTDOWN ON SIDE - MOBILE RESPONSIVE */
    .countdown-badge {
      position: fixed;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      padding: 12px 20px;
      border-radius: 80px;
      font-family: 'Courier New', monospace;
      font-size: clamp(1rem, 4vw, 1.6rem);;
      font-weight: 900;
      color: #fff0c0;
      text-shadow: 0 0 15px #ffaa33;
      letter-spacing: 6px;
      z-index: 150;
      opacity: 0;
      transition: opacity 0.2s ease;
      border: 1px solid #ffcd94;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    @media (min-width: 768px) {
      .countdown-badge {
        right: 28px;
        padding: 18px 32px;
        font-size: clamp(1rem, 4vw, 1.6rem);
        letter-spacing: 12px;
      }
    }
    .countdown-badge.show { opacity: 1; }

    /* cake disappear effect */
    .cake-container {
      position: relative;
      display: flex;
      justify-content: center;
      transition: all 0.55s cubic-bezier(0.34, 1.2, 0.64, 1);
      width: 100%;
    }
    .cake-disappear {
      opacity: 0;
      transform: scale(0.05) rotate(12deg);
      pointer-events: none;
      transition: 0.45s;
    }

    /* BIG HAPPY BIRTHDAY OVERLAY - FULLY RESPONSIVE */
    .big-birthday {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      background: linear-gradient(135deg, #ffd89b, #f8a35e);
      color: #fff0e0;
      font-size: clamp(1rem, 4vw, 1.6rem);
      font-weight: 800;
      padding: 18px 28px;
      border-radius: 60px;
      white-space: nowrap;
      z-index: 200;
      text-align: center;
      font-family: 'Lato', cursive;
      letter-spacing: 3px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 6px rgba(255,215,150,0.6);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
      pointer-events: none;
      backdrop-filter: blur(2px);
      text-shadow: 2px 2px 0 #b45f2b;
    }
    @media (min-width: 768px) {
      .big-birthday {
        font-size: clamp(1rem, 4vw, 1.6rem);
        padding: 28px 48px;
        letter-spacing: 6px;
        white-space: nowrap;
        box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 8px rgba(255,215,150,0.6);
      }
    }
    @media (max-width: 480px) {
      .big-birthday {
        font-size: clamp(1rem, 4vw, 1.6rem);
        padding: 12px 20px;
        letter-spacing: 2px;
        white-space: nowrap;
      }
    }
    .big-birthday.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    .big-birthday.hide {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      transition: 0.3s;
    }

    /* LARGE BEAUTIFUL CARDS - MOBILE STACK */
    .cards-gallery {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 190;
      flex-wrap: wrap;
      padding: 0 12px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s ease, transform 0.5s ease;
    }
    @media (min-width: 768px) {
      .cards-gallery {
        bottom: 35px;
        gap: 30px;
        padding: 0 20px;
      }
    }
    .cards-gallery.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .card {
      background: #fffef2;
      border-radius: 50px;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #b54616;
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid #ffbe76;
      backdrop-filter: blur(4px);
      background: rgba(255, 252, 240, 0.98);
      pointer-events: auto;
      font-family: 'Segoe UI', system-ui;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @media (min-width: 768px) {
      .card {
        padding: 18px 32px;
        font-size: clamp(1rem, 4vw, 1.6rem);
        border: 3px solid #ffbe76;
        gap: 12px;
      }
    }
    .card:active { transform: scale(0.96); background: #ffe5c4; }
    .card-emoji { font-size: clamp(1rem, 4vw, 1.6rem); }
    @media (min-width: 768px) {
      .card-emoji { font-size: clamp(1rem, 4vw, 1.6rem); }
    }

    /* MODAL PANELS — FULLY RESPONSIVE */
    .modal-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: 90%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      background: #fffaf0;
      border-radius: 48px;
      padding: 20px 18px 28px;
      z-index: 300;
      text-align: center;
      box-shadow: 0 40px 60px rgba(0,0,0,0.6);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      border: 3px solid #ffbc6e;
      font-family: 'Segoe UI', system-ui;
    }
    @media (min-width: 768px) {
      .modal-panel {
        width: 380px;
        padding: 32px 24px 36px;
      }
    }
    .modal-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    /* SCRATCH ZONE */
    .scratch-container {
      position: relative;
      margin: 20px 0;
      background: #d9c2a7;
      border-radius: 48px;
      overflow: hidden;
      cursor: crosshair;
    }
    .scratch-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
      background: transparent;
      pointer-events: none;
      padding: 16px;
      z-index: 2;
      color: #442a18;
      font-weight: bold;
      text-shadow: 0 0 2px white;
    }
    @media (min-width: 768px) {
      .scratch-message { font-size: clamp(1rem, 4vw, 1.6rem); }
    }
    .scratch-message.revealed {
      color: #b33f12;
      font-size: 1rem;
      font-weight: 800;
    }
    .code-input {
      border: 3px solid #ffbc6e;
      border-radius: 60px;
      padding: 12px 15px;
      font-size: 1.2rem;
      width: 140px;
      text-align: center;
      margin: 15px auto;
      font-weight: bold;
      background: #fff4e6;
      outline: none;
      font-family: monospace;
    }
    @media (min-width: 768px) {
      .code-input {
        padding: 14px 18px;
        font-size: 1.5rem;
        width: 160px;
      }
    }
    .code-btn, .rope-cut-btn {
      background: #ffcd94;
      border: none;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    @media (min-width: 768px) {
      .code-btn, .rope-cut-btn {
        padding: 12px 32px;
        font-size: 1.1rem;
      }
    }
    .rope-area {
      background: #f0e0ce;
      border-radius: 80px;
      padding: 18px 10px;
      margin: 18px 0;
      cursor: pointer;
      font-size: 1.3rem;
      letter-spacing: 4px;
      font-weight: bold;
      transition: 0.1s;
      border: 2px dashed #ab7e5a;
      word-break: break-word;
    }
    @media (min-width: 768px) {
      .rope-area {
        padding: 24px 12px;
        font-size: 2rem;
        letter-spacing: 8px;
      }
    }
    .close-modal {
      background: #e7cfb0;
      border: none;
      margin-top: 20px;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    @media (min-width: 768px) {
      .close-modal {
        margin-top: 24px;
        padding: 10px 28px;
        font-size: 1rem;
      }
    }
    .close-modal:hover { background: #dabb90; }

    /* Balloons & party popper */
    .balloons-area {
      position: fixed;
      bottom: -120px;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      overflow: hidden;
    }
    .balloon {
      position: absolute;
      bottom: -80px;
      width: 45px;
      height: 55px;
      background: radial-gradient(circle at 30% 30%, #fff3dc, #f9b8c6);
      border-radius: 50%;
      box-shadow: -3px 4px 12px rgba(0,0,0,0.2);
      animation: floatUp linear forwards;
    }
    @media (min-width: 768px) {
      .balloon {
        width: 52px;
        height: 64px;
      }
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 20px;
      background: #ad8b72;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.95; }
      100% { transform: translateY(-120vh) rotate(14deg); opacity: 0.2; }
    }
    .popper-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 280;
    }
    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 12px;
      background: #f3b33d;
      opacity: 0.9;
      animation: popParticle 1.2s ease-out forwards;
    }
    @media (min-width: 768px) {
      .confetti-piece {
        width: 10px;
        height: 16px;
      }
    }
    @keyframes popParticle {
      0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--dx, 100px), var(--dy, -200px)) rotate(540deg); opacity: 0; }
    }

    .start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000dd;
      backdrop-filter: blur(12px);
      z-index: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.7s ease;
    }
    .start-card {
      background: #fff6e8;
      padding: 1.5rem 2rem;
      border-radius: 60px;
      text-align: center;
      box-shadow: 0 30px 50px #00000055;
      animation: gentlePulse 1.8s infinite;
      margin: 0 20px;
    }
    @media (min-width: 768px) {
      .start-card {
        padding: 2rem 3rem;
      }
    }
    .start-card h2 { color: #c45a2c; font-size: 1.4rem; }
    @media (min-width: 768px) {
      .start-card h2 { font-size: 2rem; }
    }
    .start-card p { color: #5e3a28; font-size: 1rem; font-weight: bold; }
    @media (min-width: 768px) {
      .start-card p { font-size: 1.3rem; }
    }
    @keyframes gentlePulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .main-wrapper {
  transform: scale(1.15);
}
    /* ensure cake container scales properly */
    .cake-container svg {
      max-width: 95vw;
      height: auto;
    }
    @media (min-width: 768px) {
      .cake-container svg {
        max-width: 200px;
      }
    }
  </style>
</head>

<script>
  (function(){
    const startOverlay = document.getElementById('startOverlay');
    const mainWrapper = document.getElementById('mainWrapper');
    const candleArea = document.getElementById('candleHitArea');
    const timerDiv = document.getElementById('timerBox');
    const cakeContainer = document.getElementById('cakeContainer');
    const flames = document.querySelectorAll('.fuego');
    const balloonsArea = document.getElementById('balloonsArea');
    const popperCanvas = document.getElementById('popperCanvas');
    const bigMsg = document.getElementById('bigBirthdayMsg');
    const cardsGallery = document.getElementById('cardsGallery');
    
    let timerActive = false, cakeGone = false, balloonInterval = null, bigMsgShown = false;
    
    function partyPopBurst() {
      for(let i=0;i<220;i++){
        const conf = document.createElement('div');
        conf.classList.add('confetti-piece');
        const colors = ['#FFB347','#FF6B6B','#4ECDC4','#FFE66D','#FF8C42','#E56B6F','#FF69B4','#F39C12','#DA627D'];
        conf.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        const startX = window.innerWidth/2 + (Math.random()-0.5)*320;
        const startY = window.innerHeight/2 + (Math.random()-0.5)*220;
        conf.style.left = startX+'px';
        conf.style.top = startY+'px';
        const dx = (Math.random()-0.5)*380;
        const dy = -Math.random()*450 - 80;
        conf.style.setProperty('--dx', dx+'px');
        conf.style.setProperty('--dy', dy+'px');
        popperCanvas.appendChild(conf);
        setTimeout(()=>conf.remove(),1400);
      }
    }
    
    function blowOut() {
      flames.forEach(f=>{ f.style.animation='none'; f.style.opacity='0'; f.style.background='transparent'; f.style.boxShadow='none'; });
    }
    
    function startBalloons() {
      if(balloonInterval) clearInterval(balloonInterval);
      function createBalloon(){
        const b = document.createElement('div');
        b.classList.add('balloon');
        const sz = 40 + Math.random()*35;
        b.style.width=sz+'px';
        b.style.height=(sz*1.2)+'px';
        const hue = Math.floor(Math.random()*360);
        b.style.background=`radial-gradient(circle at 30% 30%, #fff5e0, hsl(${hue}, 75%, 68%))`;
        b.style.left = Math.random()*(window.innerWidth-70)+'px';
        const duration = 5+Math.random()*7;
        b.style.animationDuration=duration+'s';
        balloonsArea.appendChild(b);
        setTimeout(()=>b.remove(), duration*1000);
      }
      for(let i=0;i<8;i++) setTimeout(createBalloon, i*130);
      balloonInterval = setInterval(()=>{ createBalloon(); if(Math.random()>0.6) setTimeout(createBalloon,200); }, 800);
    }
    
    function showBigBirthday() {
      if(bigMsgShown) return;
      bigMsgShown = true;
      bigMsg.classList.add('show');
      setTimeout(() => {
        bigMsg.classList.add('hide');
        setTimeout(() => {
          bigMsg.classList.remove('show', 'hide');
        }, 500);
      }, 4000);
    }
    
    function showCardsAfterCake() {
      cardsGallery.classList.add('visible');
    }
    
    function startCountdown() {
      if(timerActive || cakeGone) return;
      timerActive = true;
      let cnt = 3;
      timerDiv.classList.add('show');
      timerDiv.innerText = cnt;
      const interval = setInterval(()=>{
        cnt--;
        if(cnt>=1) timerDiv.innerText = cnt;
        else if(cnt===0){
          timerDiv.innerText = '✨';
          clearInterval(interval);
          blowOut();
          setTimeout(()=>{
            if(!cakeGone){
              cakeGone = true;
              cakeContainer.classList.add('cake-disappear');
              partyPopBurst();
              startBalloons();
              showBigBirthday();
              setTimeout(() => {
                showCardsAfterCake();
              }, 300);
            }
            setTimeout(()=>timerDiv.classList.remove('show'),800);
          },150);
        }
      },1000);
    }
    
    let activeModal = null;
    function closeAllModals(){
      if(activeModal) { 
        activeModal.classList.remove('open'); 
        activeModal = null; 
      }
      document.querySelectorAll('.modal-panel').forEach(m => {
        m.classList.remove('open');
      });
    }
    
    function getModal(id, htmlContent) {
      let modal = document.getElementById(id);
      if(!modal){
        modal = document.createElement('div');
        modal.id = id;
        modal.className = 'modal-panel';
        document.body.appendChild(modal);
      }
      modal.innerHTML = htmlContent;
      const closeBtn = modal.querySelector('.close-modal');
      if(closeBtn) {
        closeBtn.onclick = (e) => { e.stopPropagation(); closeAllModals(); };
      }
      return modal;
    }
    
    function showScratchCard() {
      const modal = getModal('scratchRealModal', `
        <h3>🎁✨ Scratch to Reveal ✨🎁</h3>
        <div class="scratch-container" style="position:relative; width:100%;">
          <canvas id="scratchCanvas" width="300" height="160" style="width:100%; height:auto; border-radius:48px; display:block; background:#d1bb9a; cursor:crosshair;"></canvas>
          <div id="scratchHiddenMsg" class="scratch-message" style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; pointer-events:none; background:transparent; font-weight:bold;">💖✨ SCRATCH ME ✨💖</div>
        </div>
        <button class="close-modal">Close</button>
      `);
      closeAllModals();
      modal.classList.add('open');
      activeModal = modal;
      
      const canvas = modal.querySelector('#scratchCanvas');
      const ctx = canvas.getContext('2d');
      const container = modal.querySelector('.scratch-container');
      const hiddenMsgDiv = modal.querySelector('#scratchHiddenMsg');
      let isDrawing = false;
      
      function resizeAndDraw(){
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = 160;
        ctx.fillStyle = '#b6a07e';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#9c8462';
        for(let i=0;i<300;i++){
          ctx.fillRect((i*17)%canvas.width, (i*9)%canvas.height, 7, 7);
        }
        ctx.fillStyle = '#8e7658';
        for(let i=0;i<120;i++) ctx.fillRect((i*23)%canvas.width, (i*13)%canvas.height, 5, 5);
      }
      
      function scratch(x,y){
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI*2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        checkReveal();
      }
      
      function checkReveal(){
        const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        let erased = 0, total = imgData.data.length/4;
        for(let i=0;i<imgData.data.length;i+=4){
          if(imgData.data[i+3] === 0) erased++;
        }
        if(erased/total > 0.4){
          hiddenMsgDiv.innerHTML = '<div style="background:#ffefcf; border-radius:32px; padding:12px; color:#b54616; font-size:1rem;">🎉 Happyy Birthdayyy Rasgullee! 🎉<br>💕 You\'re the sweetest! You’re not old… you’re just limited edition now✨Like rare…but also slightly expired🫣💕</div>';
          hiddenMsgDiv.classList.add('revealed');
        }
      }
      
      function getCoords(e){
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if(e.touches){
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }
        let x = (clientX - rect.left) * scaleX;
        let y = (clientY - rect.top) * scaleY;
        if(x>=0 && x<=canvas.width && y>=0 && y<=canvas.height) return {x,y};
        return null;
      }
      
      function handleStart(e){ e.preventDefault(); isDrawing=true; const pos=getCoords(e); if(pos) scratch(pos.x,pos.y); }
      function handleMove(e){ if(!isDrawing) return; e.preventDefault(); const pos=getCoords(e); if(pos) scratch(pos.x,pos.y); }
      function handleEnd(e){ isDrawing=false; }
      
      setTimeout(()=>{ resizeAndDraw(); }, 30);
      window.addEventListener('resize', ()=>{ if(modal.classList.contains('open')) resizeAndDraw(); });
      canvas.addEventListener('mousedown', handleStart);
      canvas.addEventListener('mousemove', handleMove);
      canvas.addEventListener('mouseup', handleEnd);
      canvas.addEventListener('touchstart', handleStart, {passive:false});
      canvas.addEventListener('touchmove', handleMove, {passive:false});
      canvas.addEventListener('touchend', handleEnd);
    }
    
    function showCodeCard(){
      const modal = getModal('codeModal', `
        <h3>🔐✨ Enter Secret Code ✨🔐</h3>
        <input type="text" id="codeInput" class="code-input" placeholder="1404" maxlength="4" inputmode="numeric">
        <div><button class="code-btn" id="unlockCodeBtn">Unlock Magic 🎁</button></div>
        <div id="codeResultMsg" style="margin-top: 14px; font-weight: bold;"></div>
        <button class="close-modal">Close</button>
      `);
      closeAllModals();
      modal.classList.add('open');
      activeModal = modal;
      const unlockBtn = modal.querySelector('#unlockCodeBtn');
      const codeInp = modal.querySelector('#codeInput');
      const resDiv = modal.querySelector('#codeResultMsg');
      unlockBtn.onclick = () => {
        if(codeInp.value === '1404'){
          resDiv.innerHTML = '🎉✨ CORRECT!✨🎉<br>Roses are red,<br> Birthdays are fun,<br>You’re getting older…<br>but not wiser, hun 😭💀<br>Another year older, what can I say?<br>You’re still the same chaos in a different way 😌✨<br>Cake getting bigger, candles too,<br>At this point we need a fire crew 🚒🔥<br>But jokes aside (just a little bit 😏),<br> Life’s more fun because you exist 💫<br>So stay weird, stay you, don’t ever change<br>Because normal people are kinda strange 😜';
          resDiv.style.color='#b84618';
          partyPopBurst();
        } else {
          resDiv.innerHTML = '❌ Wrong code. Hint: 1404 ❌';
          resDiv.style.color='#b33';
        }
      };
    }
    
    function showRopeCard(){
      let cut = false;
      const modal = getModal('ropeModal', `
        <h3>✂️ Cut the Rope of Wishes ✂️</h3>
        <div class="rope-area" id="ropeInteractive">╍╍╍╍╍╍  ✂️  ╍╍╍╍╍╍</div>
        <div id="ropeMessage"></div>
        <button class="close-modal">Close</button>
      `);
      closeAllModals();
      modal.classList.add('open');
      activeModal = modal;
      const ropeDiv = modal.querySelector('#ropeInteractive');
      const msgDiv = modal.querySelector('#ropeMessage');
      ropeDiv.style.cursor = 'pointer';
      ropeDiv.onclick = () => {
        if(!cut){
          cut=true;
          ropeDiv.innerHTML = '✂️  CUT  ✂️     💖  Umm hmm  💖<br> You’re one of those people who makes everything feel better just by being around no effort, no noise, just you I don’t say it often, but you truly matter more than you think, and having you in my life means a lot 💫I hope this year brings you real happiness....the kind that stays… not just for a day but for a long time 🤍 Just stay the way you are  that’s more than enough 🌼';
          ropeDiv.style.background = '#fbdfb5';
          msgDiv.innerHTML = '🎉🎉';
          partyPopBurst();
        } else {
          msgDiv.innerHTML = '✨';
        }
      };
    }
    
    document.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click',(e)=>{
        e.stopPropagation();
        if(!cakeGone){
          const hint = document.createElement('div');
          hint.innerText = '✨ First, click on the candle and let the countdown finish! ✨';
          hint.style.position='fixed'; hint.style.bottom='100px'; hint.style.left='0'; hint.style.right='0';
          hint.style.background='#fff6e6'; hint.style.color='#b23c12'; hint.style.padding='12px 20px'; hint.style.borderRadius='60px';
          hint.style.width='fit-content'; hint.style.margin='auto'; hint.style.zIndex='999'; hint.style.fontWeight='bold';
          hint.style.fontSize='0.8rem';
          hint.style.textAlign='center';
          document.body.appendChild(hint);
          setTimeout(()=>hint.remove(),2200);
          return;
        }
        const type = card.dataset.card;
        if(type === 'scratch') showScratchCard();
        else if(type === 'code') showCodeCard();
        else if(type === 'rope') showRopeCard();
      });
    });
    
    startOverlay.addEventListener('click',()=>{
      startOverlay.style.opacity='0';
      setTimeout(()=>{
        startOverlay.style.display='none';
        mainWrapper.style.opacity='1';
        setTimeout(()=>{
          candleArea.classList.add('active');
          candleArea.addEventListener('click', startCountdown);
        }, 7000);
      },500);
    });
  })();
</script>
</body>
</html>
